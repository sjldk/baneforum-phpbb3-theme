<input type="file" multiple hidden>
<output class="visually-hidden"></output>
<template id="upload">
	<span class="upload">
		<img alt="">
		<progress max="1" value="0"></progress>
		<output></output>
		<button type="button">Remove</button>
	</span>
</template>
<template id="attachment">
	<span class="attachment"><img alt=""><span class="name"></span></span>
</template>
<dialog data-label="link">
	<form method="dialog">
		<h2 data-text="link">Link</h2>
		<label><span data-text="linkAddress">Web address</span> <input type="text" name="href" inputmode="url" autocomplete="url" spellcheck="false"></label>
		<p>
			<button type="submit" value="remove" data-text="linkRemove">Remove link</button>
			<button type="button" command="close" data-text="linkCancel">Cancel</button>
			<button type="submit" value="ok" data-text="linkSave">Save</button>
		</p>
	</form>
</dialog>
<form popover class="table-picker" data-label="table">
	<div class="grid" aria-hidden="true"></div>
	<p class="size" aria-hidden="true"></p>
	<div class="fields">
		<label><span data-text="tableColumns">Columns</span> <input type="number" name="columns" min="1" max="8" value="3" inputmode="numeric" required></label>
		<label><span data-text="tableRows">Rows</span> <input type="number" name="rows" min="1" max="5" value="3" inputmode="numeric" required></label>
		<button type="submit" value="ok" data-text="tableInsert">Insert</button>
	</div>
</form>
<form popover class="attachment-menu" data-label="attachmentMenu">
	<label><span data-text="attachmentDescription">Description</span> <input type="text" name="description" autocomplete="off"></label>
	<p>
		<button type="button" value="remove" data-text="attachmentRemove">Delete</button>
		<button type="submit" value="ok" data-text="attachmentSave">Save</button>
	</p>
</form>
