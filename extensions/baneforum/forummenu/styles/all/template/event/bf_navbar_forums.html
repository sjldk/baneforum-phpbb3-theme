{% if loops.bf_forummenu|length %}
<span id="bf-forum-menu" class="dropdown-container" data-skip-responsive="true">
	<a href="#" class="dropdown-trigger">
		<i class="icon fa-th-list fa-fw" aria-hidden="true"></i><span>{{ lang('BF_FORUMMENU_TITLE') }}</span>
	</a>
	<div class="dropdown">
		<div class="pointer"><div class="pointer-inner"></div></div>
		<ul class="dropdown-contents bf-forummenu">
			{% for forum in loops.bf_forummenu %}
			<li class="bf-forummenu__item bf-forummenu__item--depth{{ forum.DEPTH }}{% if forum.S_CAT %} bf-forummenu__item--cat{% endif %}">
				<a href="{{ forum.U_FORUM }}">{{ forum.NAME }}</a>
			</li>
			{% endfor %}
		</ul>
	</div>
</span>
{% endif %}
