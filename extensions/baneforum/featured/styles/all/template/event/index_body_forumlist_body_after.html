{% if loops.bf_featured|length %}
<aside class="bf-featured bf-index__side" aria-labelledby="bf-featured-title">
	<h2 id="bf-featured-title" class="bf-featured__title bf-index__title">{{ lang('BF_FEATURED_TITLE') }}</h2>
	<ol class="bf-featured__list">
		{% for post in loops.bf_featured %}
		<li class="bf-featured__item">
			<img class="bf-featured__picture" src="{{ post.U_PICTURE }}" alt="" loading="lazy">
			<div class="bf-featured__body">
				<a class="bf-featured__topic" href="{{ post.U_POST }}">{{ post.TITLE }}</a>
				<span class="bf-featured__meta">{{ post.AUTHOR }} &middot; {{ post.TIME }}</span>
			</div>
		</li>
		{% endfor %}
	</ol>
</aside>
{% endif %}
