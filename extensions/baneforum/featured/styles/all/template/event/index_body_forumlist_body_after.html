{% if loops.bf_featured|length %}
<aside class="bf-featured" aria-labelledby="bf-featured-title">
	<h2 id="bf-featured-title" class="bf-index-title">{{ lang('BF_FEATURED_TITLE') }}</h2>
	<ol class="bf-featured-list">
		{% for post in loops.bf_featured %}
		<li class="bf-featured-item">
			<img class="bf-featured-picture" src="{{ post.U_PICTURE }}" alt="" loading="lazy">
			<div class="bf-featured-body">
				<a class="bf-featured-topic" href="{{ post.U_POST }}">{{ post.TITLE }}</a>
				<span class="bf-featured-meta">{{ post.AUTHOR }} &middot; {{ post.TIME }}</span>
			</div>
		</li>
		{% endfor %}
	</ol>
</aside>
{% endif %}
