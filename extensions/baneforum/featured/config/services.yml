services:
    baneforum.featured.finder:
        class: baneforum\featured\finder
        arguments:
            - '@dbal.conn'
            - '@dbal.tools'
            - '@content.visibility'
            - '%core.table_prefix%'

    baneforum.featured.listener:
        class: baneforum\featured\event\listener
        arguments:
            - '@baneforum.featured.finder'
            - '@auth'
            - '@template'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }
